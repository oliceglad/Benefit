# CI/CD Benefit: проверки бэкенда и фронтенда на каждый push и PR,
# деплой на сервер — после успешных проверок в main (или вручную).
#
# Настройки деплоя — в GitHub → Settings → Secrets and variables → Actions:
#   Variables: DEPLOY_HOST        — адрес сервера;
#              DEPLOY_KNOWN_HOSTS — ключи сервера (вывод ssh-keyscan <адрес>),
#                                   по ним проверяется, что это наш сервер.
#   Secrets:   DEPLOY_SSH_KEY     — приватный SSH-ключ root@<DEPLOY_HOST>.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
  DEPLOY_DIR: /opt/benefit

jobs:
  backend-lint:
    name: Backend · ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.10"
          args: check backend
      - run: ruff format --check backend

  backend-tests:
    name: Backend · ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - core
          - auth-service
          - candidate-service
          - assessment-service
          - applications-service
          - notification-service
          - chat-service
          - employer-service
          - matching-service
          - mail-service
          - fsp-id-mock
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Тесты создают свою базу <сервис>_test.
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    defaults:
      run:
        working-directory: backend/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/${{ matrix.service }}/pyproject.toml
      - name: Системные библиотеки (PDF-резюме)
        if: matrix.service == 'candidate-service'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core
      - run: pip install ../libs/benefit-common -e ".[dev]"
      - run: pytest -q

  frontend:
    name: Frontend · lint, types, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  deploy:
    name: Deploy → ${{ vars.DEPLOY_HOST }}
    needs: [backend-lint, backend-tests, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: http://${{ vars.DEPLOY_HOST }}/
    # Деплои не идут параллельно и не прерывают друг друга.
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: SSH-ключ и ключ сервера
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_HOST" || { echo "Не задана переменная DEPLOY_HOST"; exit 1; }
          test -n "$DEPLOY_KNOWN_HOSTS" || { echo "Не задана переменная DEPLOY_KNOWN_HOSTS"; exit 1; }
          test -n "$DEPLOY_SSH_KEY" || { echo "Не задан секрет DEPLOY_SSH_KEY"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          # Ключи сервера зафиксированы: подмена сервера оборвёт деплой.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host deploy
            HostName ${DEPLOY_HOST}
            User root
            IdentityFile ~/.ssh/deploy
            IdentitiesOnly yes
            ServerAliveInterval 30
          EOF

      - name: Подготовка сервера
        run: ssh deploy "mkdir -p ${DEPLOY_DIR} && (command -v rsync >/dev/null || (apt-get update -qq && apt-get install -y -qq rsync))"

      - name: Копирование кода
        run: |
          echo "${GITHUB_SHA::7}" > REVISION
          # .env и пакеты тестов живут только на сервере: исключены из
          # копирования, поэтому --delete их не трогает.
          rsync -az --delete \
            --exclude .git/ \
            --exclude .env \
            --exclude backend/assessment-service/content/ \
            --exclude node_modules/ \
            --exclude .pnpm-store/ \
            --exclude .venv/ \
            --exclude __pycache__/ \
            --exclude .pytest_cache/ \
            --exclude .ruff_cache/ \
            --exclude '*.egg-info/' \
            --exclude frontend/dist/ \
            ./ deploy:${DEPLOY_DIR}/

      - name: Сборка и запуск
        run: ssh deploy "cd ${DEPLOY_DIR} && PUBLIC_HOST=${DEPLOY_HOST} bash .github/scripts/deploy.sh"
