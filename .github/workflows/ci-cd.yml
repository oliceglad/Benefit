# CI/CD Benefit: проверки бэкенда и фронтенда на каждый push и PR,
# деплой на сервер — после успешных проверок в main (или вручную).
#
# Настройки деплоя — в GitHub → Settings → Secrets and variables → Actions:
#   Variables: DEPLOY_HOST        — адрес сервера;
#              DEPLOY_KNOWN_HOSTS — ключи сервера (вывод ssh-keyscan <адрес>),
#                                   по ним проверяется, что это наш сервер.
#   Secrets:   DEPLOY_SSH_KEY     — приватный SSH-ключ root@<DEPLOY_HOST>.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
  DEPLOY_DIR: /opt/benefit

jobs:
  backend-lint:
    name: Backend · ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.10"
          args: check backend
      - run: ruff format --check backend

  backend-tests:
    name: Backend · ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - core
          - auth-service
          - candidate-service
          - assessment-service
          - applications-service
          - notification-service
          - chat-service
          - employer-service
          - matching-service
          - mail-service
          - fsp-id-mock
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Тесты создают свою базу <сервис>_test.
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    defaults:
      run:
        working-directory: backend/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/${{ matrix.service }}/pyproject.toml
      - name: Системные библиотеки (PDF-резюме)
        if: matrix.service == 'candidate-service'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core
      - run: pip install ../libs/benefit-common -e ".[dev]"
      - run: pytest -q

  frontend:
    name: Frontend · lint, types, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # Образы собираются здесь, а не на сервере: сборке фронтенда и дюжины
  # Python-образов не хватает 1 ГБ памяти сервера.
  images:
    name: Images → GHCR
    needs: [backend-lint, backend-tests, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      prefix: ${{ steps.tag.outputs.prefix }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        name: Имена образов
        run: |
          # В имени образа владелец репозитория — только в нижнем регистре.
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "prefix=ghcr.io/${owner}/benefit" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Сборка и публикация
        env:
          IMAGE_PREFIX: ${{ steps.tag.outputs.prefix }}
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
          VITE_LEGAL_OPERATOR_NAME: ${{ vars.VITE_LEGAL_OPERATOR_NAME }}
          VITE_LEGAL_OPERATOR_ADDRESS: ${{ vars.VITE_LEGAL_OPERATOR_ADDRESS }}
          VITE_LEGAL_CONTACT_EMAIL: ${{ vars.VITE_LEGAL_CONTACT_EMAIL }}
        run: |
          # Только сервисы со своим Dockerfile (у остальных — готовые образы).
          built=$(docker compose config --format json \
            | jq -r '.services | to_entries[] | select(.value.build) | .key')
          docker compose build $built
          docker compose push $built

  deploy:
    name: Deploy → ${{ vars.DEPLOY_HOST }}
    needs: [images]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: http://${{ vars.DEPLOY_HOST }}/
    # Деплои не идут параллельно и не прерывают друг друга.
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: SSH-ключ и ключ сервера
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_HOST" || { echo "Не задана переменная DEPLOY_HOST"; exit 1; }
          test -n "$DEPLOY_KNOWN_HOSTS" || { echo "Не задана переменная DEPLOY_KNOWN_HOSTS"; exit 1; }
          test -n "$DEPLOY_SSH_KEY" || { echo "Не задан секрет DEPLOY_SSH_KEY"; exit 1; }
          install -m 700 -d ~/.ssh
          # Windows-переводы строк из буфера обмена ломают ключ.
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          # Секрет должен быть приватным ключом без пароля. Отпечаток (публичный)
          # сверяется с ssh-keygen -lf /root/.ssh/authorized_keys на сервере.
          ssh-keygen -y -P '' -f ~/.ssh/deploy > ~/.ssh/deploy.pub || {
            echo "DEPLOY_SSH_KEY — не приватный ключ или ключ с паролем"; exit 1; }
          echo "Ключ деплоя: $(ssh-keygen -lf ~/.ssh/deploy.pub)"
          # Ключи сервера зафиксированы: подмена сервера оборвёт деплой.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host deploy
            HostName ${DEPLOY_HOST}
            User root
            IdentityFile ~/.ssh/deploy
            IdentitiesOnly yes
            # Только ключ: без попыток входа по паролю.
            BatchMode yes
            PreferredAuthentications publickey
            ServerAliveInterval 30
            ServerAliveCountMax 10
          EOF

      - name: Подготовка сервера
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh deploy "mkdir -p ${DEPLOY_DIR} \
            && (command -v rsync >/dev/null || (apt-get update -qq && apt-get install -y -qq rsync)) \
            && (command -v docker >/dev/null || (curl -fsSL https://get.docker.com | sh))"
          # Доступ к приватным образам GHCR. Токен действует только до конца
          # этого запуска — дольше серверу он и не нужен.
          printf '%s' "$GHCR_TOKEN" | ssh deploy "docker login ghcr.io -u ${{ github.actor }} --password-stdin"

      - name: Копирование кода
        run: |
          echo "${GITHUB_SHA::7}" > REVISION
          # .env и пакеты тестов живут только на сервере: исключены из
          # копирования, поэтому --delete их не трогает.
          rsync -az --delete \
            --exclude .git/ \
            --exclude .env \
            --exclude backend/assessment-service/content/ \
            --exclude node_modules/ \
            --exclude .pnpm-store/ \
            --exclude .venv/ \
            --exclude __pycache__/ \
            --exclude .pytest_cache/ \
            --exclude .ruff_cache/ \
            --exclude '*.egg-info/' \
            --exclude frontend/dist/ \
            ./ deploy:${DEPLOY_DIR}/

      - name: Запуск на сервере
        run: |
          # Деплой идёт на сервере в фоне (setsid + nohup): обрыв SSH во время
          # скачивания образов и запуска его не прерывает. Лог — короткими
          # подключениями, итог — из deploy.status.
          ssh deploy "cd ${DEPLOY_DIR} && rm -f deploy.status deploy.log && \
            PUBLIC_HOST=${DEPLOY_HOST} IMAGE_PREFIX=${{ needs.images.outputs.prefix }} \
            IMAGE_TAG=${{ needs.images.outputs.tag }} \
            setsid nohup bash .github/scripts/deploy.sh --detached \
            </dev/null >/dev/null 2>&1 &"
          offset=0
          deadline=$((SECONDS + 45 * 60))
          while [ "$SECONDS" -lt "$deadline" ]; do
            sleep 15
            # Сервер под нагрузкой может не ответить — это не повод падать.
            if ssh -o ConnectTimeout=20 deploy \
                "tail -c +$((offset + 1)) ${DEPLOY_DIR}/deploy.log 2>/dev/null" > chunk; then
              cat chunk
              offset=$((offset + $(wc -c < chunk)))
            fi
            status=$(ssh -o ConnectTimeout=20 deploy "cat ${DEPLOY_DIR}/deploy.status 2>/dev/null" || true)
            if [ -n "$status" ]; then
              ssh deploy "tail -c +$((offset + 1)) ${DEPLOY_DIR}/deploy.log" || true
              echo "Деплой завершился с кодом $status"
              exit "$status"
            fi
          done
          echo "Деплой не завершился за 45 минут — смотрите ${DEPLOY_DIR}/deploy.log на сервере"
          exit 1
