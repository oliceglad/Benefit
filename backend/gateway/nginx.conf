# API-шлюз Benefit: единая точка входа и ограничение частоты запросов.
# Сервисы за шлюзом наружу не публикуются, поэтому лимиты нельзя обойти.

# Встроенный DNS Docker: адреса сервисов перечитываются после перезапуска.
resolver 127.0.0.11 valid=10s ipv6=off;

# Вход, регистрация, коды подтверждения: защита от перебора паролей и кодов.
limit_req_zone $binary_remote_addr zone=auth_strict:10m rate=10r/m;
# Тяжёлые операции: разбор и генерация PDF.
limit_req_zone $binary_remote_addr zone=heavy:10m rate=20r/m;
# Остальные запросы к API.
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

limit_req_status 429;
limit_req_log_level warn;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    set $auth_service http://auth-service:8000;
    set $core_service http://core:8000;
    set $candidate_service http://candidate-service:8000;
    set $assessment_service http://assessment-service:8000;
    set $applications_service http://applications-service:8000;
    set $notification_service http://notification-service:8000;
    set $chat_service http://chat-service:8000;
    set $employer_service http://employer-service:8000;
    set $matching_service http://matching-service:8000;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Ответ в формате ошибок auth-service.
    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        add_header Retry-After 60 always;
        return 429 '{"error":{"code":"rate_limited","message":"Слишком много запросов, попробуйте позже"}}';
    }

    # --- auth-service -----------------------------------------------------
    location ~ ^/api/v1/auth/(login|register|verify-email|resend-code|oauth/exchange)$ {
        limit_req zone=auth_strict burst=5 nodelay;
        proxy_pass $auth_service;
    }

    location /api/v1/auth/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass $auth_service;
    }

    location /api/v1/users/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass $auth_service;
    }

    location /.well-known/ {
        proxy_pass $auth_service;
    }

    # --- candidate-service -------------------------------------------------
    location ~ ^/api/v1/candidates/(.+/)?(resume/import|resume\.pdf)$ {
        limit_req zone=heavy burst=5 nodelay;
        proxy_pass $candidate_service;
    }

    location /api/v1/candidates/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass $candidate_service;
    }

    # --- assessment-service (тестирование грейда) ---------------------------
    location /api/v1/assessments/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass $assessment_service;
    }

    # --- applications-service (приглашения и отклики) ----------------------
    location /api/v1/invitations {
        limit_req zone=api burst=40 nodelay;
        proxy_pass $applications_service;
    }

    # --- notification-service ------------------------------------------------
    location /api/v1/notifications {
        limit_req zone=api burst=40 nodelay;
        proxy_pass $notification_service;
    }

    # --- chat-service (переписка и задания) ------------------------------------
    # WebSocket: соединение живёт долго, сервер шлёт пинги каждые 25 с.
    location = /api/v1/chat/ws {
        proxy_pass $chat_service;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Загрузка вложений: до 20 МБ.
    location ~ ^/api/v1/chat/conversations/[^/]+/attachments$ {
        client_max_body_size 25m;
        limit_req zone=heavy burst=10 nodelay;
        proxy_pass $chat_service;
    }

    location /api/v1/chat/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass $chat_service;
    }

    # --- employer-service (компания, потребности, вакансии) -------------------
    location /api/v1/employers/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass $employer_service;
    }

    location /api/v1/vacancies {
        limit_req zone=api burst=40 nodelay;
        proxy_pass $employer_service;
    }

    # --- matching-service (банк кандидатов) -------------------------------------
    location /api/v1/talent/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass $matching_service;
    }

    # --- applications-service: отклики --------------------------------------------
    location /api/v1/applications {
        limit_req zone=api burst=40 nodelay;
        proxy_pass $applications_service;
    }

    # Внутренние API сервисов наружу не публикуются.
    location /internal/ {
        return 404;
    }

    # --- core (вакансии, подбор) -------------------------------------------
    location / {
        limit_req zone=api burst=40 nodelay;
        proxy_pass $core_service;
    }
}
