# API-шлюз Benefit: единая точка входа, лимиты, сквозной request_id,
# понятные ошибки, если сервис недоступен.
# Сервисы за шлюзом наружу не публикуются, поэтому лимиты нельзя обойти.

# Встроенный DNS Docker: адреса сервисов перечитываются после перезапуска.
resolver 127.0.0.11 valid=10s ipv6=off;

# Вход, регистрация, коды подтверждения: защита от перебора паролей и кодов.
limit_req_zone $binary_remote_addr zone=auth_strict:10m rate=10r/m;
# Тяжёлые операции: разбор и генерация PDF, загрузка файлов.
limit_req_zone $binary_remote_addr zone=heavy:10m rate=20r/m;
# Остальные запросы к API.
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

limit_req_status 429;
limit_req_log_level warn;

# CORS с credentials (cookie) — только для доверенных адресов фронтенда.
# Если фронтенд отдаётся через этот же шлюз, CORS не нужен вовсе.
map $http_origin $cors_origin {
    default "";
    "http://localhost:3000" $http_origin;
    "http://127.0.0.1:3000" $http_origin;
}

map $upstream_name $upstream_title {
    default                 "Сервис";
    "core"                  "Основной сервис";
    "auth-service"          "Сервис авторизации";
    "candidate-service"     "Сервис профилей кандидатов";
    "assessment-service"    "Сервис тестирования";
    "applications-service"  "Сервис приглашений и откликов";
    "notification-service"  "Сервис уведомлений";
    "chat-service"          "Сервис переписки";
    "employer-service"      "Сервис работодателей";
    "matching-service"      "Сервис подбора кандидатов";
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# Лог доступа с request_id — по нему запрос находится в логах сервисов.
log_format benefit '$remote_addr [$time_local] "$request" $status '
                   '$body_bytes_sent $request_time rid=$request_id '
                   'upstream=$upstream_name ($upstream_status)';
access_log /dev/stdout benefit;

server {
    listen 80;
    server_name _;
    server_tokens off;

    client_max_body_size 10m;

    # Имя сервиса, обслуживающего location (для ошибок и логов).
    set $upstream_name "core";

    # --- Заголовки ответа -----------------------------------------------------
    add_header X-Request-ID $request_id always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    # Не передавать URL (например, одноразовый код входа) сторонним сайтам.
    add_header Referrer-Policy no-referrer always;
    # Для HTTPS в production добавьте:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-CSRF-Token, X-Auth-Mode" always;
    add_header Access-Control-Expose-Headers "X-Request-ID" always;
    add_header Access-Control-Max-Age 600 always;
    add_header Vary Origin always;

    # Preflight-запросы браузера отвечаются шлюзом.
    if ($request_method = OPTIONS) {
        return 204;
    }

    set $auth_service http://auth-service:8000;
    set $core_service http://core:8000;
    set $candidate_service http://candidate-service:8000;
    set $assessment_service http://assessment-service:8000;
    set $applications_service http://applications-service:8000;
    set $notification_service http://notification-service:8000;
    set $chat_service http://chat-service:8000;
    set $employer_service http://employer-service:8000;
    set $matching_service http://matching-service:8000;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    # Сервис возвращает тот же ID — оставляем один заголовок (от шлюза).
    proxy_hide_header X-Request-ID;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_connect_timeout 3s;
    proxy_read_timeout 60s;

    # --- Ошибки шлюза в общем формате -----------------------------------------
    error_page 429 = @rate_limited;
    error_page 413 = @too_large;
    # Только ошибки самого шлюза (сервис не запущен, не отвечает):
    # ответы сервисов, в том числе их 503, передаются как есть.
    error_page 502 503 504 = @upstream_down;

    location @rate_limited {
        default_type application/json;
        add_header Retry-After 60 always;
        add_header X-Request-ID $request_id always;
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        return 429 '{"error":{"code":"rate_limited","message":"Слишком много запросов, попробуйте через минуту","service":"gateway","request_id":"$request_id"}}';
    }

    location @too_large {
        default_type application/json;
        add_header X-Request-ID $request_id always;
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        return 413 '{"error":{"code":"payload_too_large","message":"Слишком большой запрос или файл","service":"gateway","request_id":"$request_id"}}';
    }

    location @upstream_down {
        default_type application/json;
        add_header Retry-After 10 always;
        add_header X-Request-ID $request_id always;
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        return 503 '{"error":{"code":"service_unavailable","message":"$upstream_title сейчас недоступен (не запущен или перегружен). Попробуйте позже","service":"$upstream_name","request_id":"$request_id"}}';
    }

    # --- auth-service -----------------------------------------------------------
    location ~ ^/api/v1/auth/(login|register|verify-email|resend-code|oauth/exchange)$ {
        set $upstream_name "auth-service";
        limit_req zone=auth_strict burst=5 nodelay;
        proxy_pass $auth_service;
    }

    location /api/v1/auth/ {
        set $upstream_name "auth-service";
        limit_req zone=api burst=40 nodelay;
        proxy_pass $auth_service;
    }

    location /api/v1/users/ {
        set $upstream_name "auth-service";
        limit_req zone=api burst=40 nodelay;
        proxy_pass $auth_service;
    }

    location /.well-known/ {
        set $upstream_name "auth-service";
        proxy_pass $auth_service;
    }

    # --- candidate-service ------------------------------------------------------
    location ~ ^/api/v1/candidates/(.+/)?(resume/import|resume\.pdf)$ {
        set $upstream_name "candidate-service";
        limit_req zone=heavy burst=5 nodelay;
        proxy_pass $candidate_service;
    }

    location /api/v1/candidates/ {
        set $upstream_name "candidate-service";
        limit_req zone=api burst=40 nodelay;
        proxy_pass $candidate_service;
    }

    # --- assessment-service (тестирование грейда) -------------------------------
    location /api/v1/assessments/ {
        set $upstream_name "assessment-service";
        limit_req zone=api burst=40 nodelay;
        proxy_pass $assessment_service;
    }

    # --- applications-service (приглашения и отклики) ---------------------------
    location /api/v1/invitations {
        set $upstream_name "applications-service";
        limit_req zone=api burst=40 nodelay;
        proxy_pass $applications_service;
    }

    location /api/v1/applications {
        set $upstream_name "applications-service";
        limit_req zone=api burst=40 nodelay;
        proxy_pass $applications_service;
    }

    # Процесс найма: этапы, интервью, офферы, ответственные, история.
    location /api/v1/hiring/ {
        set $upstream_name "applications-service";
        limit_req zone=api burst=40 nodelay;
        proxy_pass $applications_service;
    }

    # --- notification-service ----------------------------------------------------
    location /api/v1/notifications {
        set $upstream_name "notification-service";
        limit_req zone=api burst=40 nodelay;
        proxy_pass $notification_service;
    }

    # --- chat-service (переписка и задания) --------------------------------------
    # WebSocket: соединение живёт долго, сервер шлёт пинги каждые 25 с.
    location = /api/v1/chat/ws {
        set $upstream_name "chat-service";
        proxy_pass $chat_service;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Загрузка вложений: до 20 МБ.
    location ~ ^/api/v1/chat/conversations/[^/]+/attachments$ {
        set $upstream_name "chat-service";
        client_max_body_size 25m;
        limit_req zone=heavy burst=10 nodelay;
        proxy_pass $chat_service;
    }

    location /api/v1/chat/ {
        set $upstream_name "chat-service";
        limit_req zone=api burst=40 nodelay;
        proxy_pass $chat_service;
    }

    # --- employer-service (компания, потребности, вакансии) ----------------------
    location /api/v1/employers/ {
        set $upstream_name "employer-service";
        limit_req zone=api burst=40 nodelay;
        proxy_pass $employer_service;
    }

    location /api/v1/vacancies {
        set $upstream_name "employer-service";
        limit_req zone=api burst=40 nodelay;
        proxy_pass $employer_service;
    }

    # --- matching-service (банк кандидатов) --------------------------------------
    location /api/v1/talent/ {
        set $upstream_name "matching-service";
        limit_req zone=api burst=40 nodelay;
        proxy_pass $matching_service;
    }

    # Внутренние API сервисов наружу не публикуются.
    location /internal/ {
        default_type application/json;
        return 404 '{"error":{"code":"not_found","message":"Ресурс не найден","service":"gateway","request_id":"$request_id"}}';
    }

    # --- core (основной сервис, состояние платформы) -----------------------------
    location / {
        set $upstream_name "core";
        limit_req zone=api burst=40 nodelay;
        proxy_pass $core_service;
    }
}
