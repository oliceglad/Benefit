name: benefit

# --- Общие шаблоны -------------------------------------------------------------

x-service-defaults: &service-defaults
  restart: unless-stopped

# PostgreSQL: у каждого сервиса своя база (database per service).
x-postgres: &postgres
  <<: *service-defaults
  image: postgres:17-alpine
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
    interval: 5s
    timeout: 5s
    retries: 10

# Переменные, общие для сервисов на библиотеке benefit-common:
# проверка JWT auth-service и токен межсервисных вызовов.
x-common-env: &common-env
  APP_ENV: ${APP_ENV:-local}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  AUTH_JWKS_URL: http://auth-service:8000/.well-known/jwks.json
  AUTH_ISSUER: ${AUTH_PUBLIC_URL:-http://localhost:8000}
  INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-change-me}
  # Адреса фронтенда: WebSocket с авторизацией по cookie — только с них.
  TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-["http://localhost:3000","http://localhost:8000"]}

# Внутренние адреса сервисов (docker-сеть).
x-service-urls: &service-urls
  AUTH_INTERNAL_URL: http://auth-service:8000
  CANDIDATE_SERVICE_URL: http://candidate-service:8000
  NOTIFICATION_SERVICE_URL: http://notification-service:8000
  CHAT_SERVICE_URL: http://chat-service:8000
  EMPLOYER_SERVICE_URL: http://employer-service:8000
  MATCHING_SERVICE_URL: http://matching-service:8000
  MAIL_SERVICE_URL: http://mail-service:8000
  APPLICATIONS_SERVICE_URL: http://applications-service:8000
  ASSESSMENT_SERVICE_URL: http://assessment-service:8000

# start_period — запас на старт (миграции, импорт) на медленном сервере: в это
# время неудачные проверки не считаются, а healthy ставится сразу, как только
# проверка прошла, — локально запуск не замедляется.
x-healthcheck: &healthcheck
  interval: 10s
  timeout: 10s
  retries: 12
  start_period: 180s

services:
  # --- API-шлюз: единственная точка входа снаружи -------------------------
  gateway:
    <<: *service-defaults
    # Имена образов: локально — benefit-<сервис>:latest (как по умолчанию у
    # compose); на сервере — готовые образы из GHCR, собранные в CI.
    image: ${IMAGE_PREFIX:-benefit}-gateway:${IMAGE_TAG:-latest}
    build:
      context: ./backend/gateway
    ports:
      # Снаружи доступны только шлюз и фронтенд (он проксирует API сюда же).
      # Базы данных, Mailpit, Keycloak и mock ФСП ID опубликованы только на
      # 127.0.0.1 (для разработки). На сервере шлюз тоже только на 127.0.0.1:
      # GATEWAY_PORT=127.0.0.1:8000, весь трафик идёт через фронтенд.
      - "${GATEWAY_PORT:-8000}:80"
    depends_on:
      core:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      candidate-service:
        condition: service_healthy
      assessment-service:
        condition: service_healthy
      applications-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      chat-service:
        condition: service_healthy
      employer-service:
        condition: service_healthy
      matching-service:
        condition: service_healthy

  # --- core --------------------------------------------------------------- --------------------------------------------
  db:
    <<: *postgres
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-benefit}
      POSTGRES_USER: ${POSTGRES_USER:-benefit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-benefit}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  core:
    <<: *service-defaults
    image: ${IMAGE_PREFIX:-benefit}-core:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: core/Dockerfile
    # Необязателен: в CI (сборка и публикация образов) .env нет.
    env_file:
      - path: .env
        required: false
    environment:
      <<: *common-env
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)"]

  # --- Аутентификация ------------------------------------------------------
  auth-db:
    <<: *postgres
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME:-auth}
      POSTGRES_USER: ${AUTH_DB_USER:-auth}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-auth}
    ports:
      - "127.0.0.1:${AUTH_DB_PORT:-5433}:5432"
    volumes:
      - auth_db_data:/var/lib/postgresql/data

  auth-service:
    <<: *service-defaults
    image: ${IMAGE_PREFIX:-benefit}-auth-service:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: auth-service/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-local}
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # CORS обрабатывает шлюз (с поддержкой cookie).
      CORS_ORIGINS: "[]"
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PUBLIC_URL: ${AUTH_PUBLIC_URL:-http://localhost:8000}
      JWT_ISSUER: ${AUTH_PUBLIC_URL:-http://localhost:8000}
      POSTGRES_HOST: auth-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${AUTH_DB_NAME:-auth}
      POSTGRES_USER: ${AUTH_DB_USER:-auth}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-auth}
      SECRET_KEY: ${AUTH_SECRET_KEY:-change-me}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-change-me}
      MAIL_SERVICE_URL: http://mail-service:8000
      # Удаление аккаунта: каждый сервис удаляет данные пользователя.
      CANDIDATE_SERVICE_URL: http://candidate-service:8000
      EMPLOYER_SERVICE_URL: http://employer-service:8000
      APPLICATIONS_SERVICE_URL: http://applications-service:8000
      CHAT_SERVICE_URL: http://chat-service:8000
      NOTIFICATION_SERVICE_URL: http://notification-service:8000
      ASSESSMENT_SERVICE_URL: http://assessment-service:8000
      MATCHING_SERVICE_URL: http://matching-service:8000
      OAUTH_FRONTEND_CALLBACK_URL: ${OAUTH_FRONTEND_CALLBACK_URL:-}
      FSP_ID_ENABLED: ${FSP_ID_ENABLED:-true}
      FSP_ID_ISSUER: ${FSP_ID_ISSUER:-http://localhost:8003/realms/fsp}
      FSP_ID_INTERNAL_ISSUER: ${FSP_ID_INTERNAL_ISSUER:-http://fsp-id-mock:8000/realms/fsp}
      FSP_ID_CLIENT_ID: ${FSP_ID_CLIENT_ID:-benefit}
      FSP_ID_CLIENT_SECRET: ${FSP_ID_CLIENT_SECRET:-fsp-dev-secret}
      KEYCLOAK_ENABLED: ${KEYCLOAK_ENABLED:-true}
      KEYCLOAK_ISSUER: http://localhost:${KEYCLOAK_PORT:-8080}/realms/benefit
      KEYCLOAK_INTERNAL_ISSUER: http://keycloak:8080/realms/benefit
      KEYCLOAK_CLIENT_ID: benefit-auth
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-benefit-keycloak-dev-secret}
    volumes:
      - auth_keys:/app/keys
    depends_on:
      auth-db:
        condition: service_healthy
      mail-service:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)"]

  # --- Кандидаты: профиль и резюме ----------------------------------------
  candidate-db:
    <<: *postgres
    environment:
      POSTGRES_DB: ${CANDIDATE_DB_NAME:-candidates}
      POSTGRES_USER: ${CANDIDATE_DB_USER:-candidates}
      POSTGRES_PASSWORD: ${CANDIDATE_DB_PASSWORD:-candidates}
    ports:
      - "127.0.0.1:${CANDIDATE_DB_PORT:-5434}:5432"
    volumes:
      - candidate_db_data:/var/lib/postgresql/data

  candidate-service:
    <<: *service-defaults
    image: ${IMAGE_PREFIX:-benefit}-candidate-service:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: candidate-service/Dockerfile
    environment:
      <<: [*common-env, *service-urls]
      POSTGRES_HOST: candidate-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${CANDIDATE_DB_NAME:-candidates}
      POSTGRES_USER: ${CANDIDATE_DB_USER:-candidates}
      POSTGRES_PASSWORD: ${CANDIDATE_DB_PASSWORD:-candidates}
      FSP_API_URL: http://fsp-id-mock:8000
      FSP_CLIENT_ID: ${FSP_ID_CLIENT_ID:-benefit}
      FSP_CLIENT_SECRET: ${FSP_ID_CLIENT_SECRET:-fsp-dev-secret}
    depends_on:
      candidate-db:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/candidates/health', timeout=3)"]

  # --- Тестирование: подтверждение грейда ---------------------------------
  assessment-db:
    <<: *postgres
    environment:
      POSTGRES_DB: ${ASSESSMENT_DB_NAME:-assessments}
      POSTGRES_USER: ${ASSESSMENT_DB_USER:-assessments}
      POSTGRES_PASSWORD: ${ASSESSMENT_DB_PASSWORD:-assessments}
    ports:
      - "127.0.0.1:${ASSESSMENT_DB_PORT:-5435}:5432"
    volumes:
      - assessment_db_data:/var/lib/postgresql/data

  assessment-service:
    <<: *service-defaults
    image: ${IMAGE_PREFIX:-benefit}-assessment-service:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: assessment-service/Dockerfile
    environment:
      <<: [*common-env, *service-urls]
      POSTGRES_HOST: assessment-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${ASSESSMENT_DB_NAME:-assessments}
      POSTGRES_USER: ${ASSESSMENT_DB_USER:-assessments}
      POSTGRES_PASSWORD: ${ASSESSMENT_DB_PASSWORD:-assessments}
      ATTEMPT_COOLDOWN_HOURS: ${ASSESSMENT_ATTEMPT_COOLDOWN_HOURS:-168}
    volumes:
      # Пакеты тестов (с ответами) — вне образа и вне git, импортируются при старте.
      - ./backend/assessment-service/content:/app/content:ro
    depends_on:
      assessment-db:
        condition: service_healthy
      candidate-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/assessments/health', timeout=3)"]

  # --- Приглашения и отклики ----------------------------------------------
  applications-db:
    <<: *postgres
    environment:
      POSTGRES_DB: ${APPLICATIONS_DB_NAME:-applications}
      POSTGRES_USER: ${APPLICATIONS_DB_USER:-applications}
      POSTGRES_PASSWORD: ${APPLICATIONS_DB_PASSWORD:-applications}
    ports:
      - "127.0.0.1:${APPLICATIONS_DB_PORT:-5437}:5432"
    volumes:
      - applications_db_data:/var/lib/postgresql/data

  applications-service:
    <<: *service-defaults
    image: ${IMAGE_PREFIX:-benefit}-applications-service:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: applications-service/Dockerfile
    environment:
      <<: [*common-env, *service-urls]
      POSTGRES_HOST: applications-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${APPLICATIONS_DB_NAME:-applications}
      POSTGRES_USER: ${APPLICATIONS_DB_USER:-applications}
      POSTGRES_PASSWORD: ${APPLICATIONS_DB_PASSWORD:-applications}
    depends_on:
      applications-db:
        condition: service_healthy
      candidate-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/invitations/health', timeout=3)"]

  # --- Работодатель: компания, потребности, вакансии ----------------------
  employer-db:
    <<: *postgres
    environment:
      POSTGRES_DB: ${EMPLOYER_DB_NAME:-employers}
      POSTGRES_USER: ${EMPLOYER_DB_USER:-employers}
      POSTGRES_PASSWORD: ${EMPLOYER_DB_PASSWORD:-employers}
    ports:
      - "127.0.0.1:${EMPLOYER_DB_PORT:-5439}:5432"
    volumes:
      - employer_db_data:/var/lib/postgresql/data

  employer-service:
    <<: *service-defaults
    image: ${IMAGE_PREFIX:-benefit}-employer-service:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: employer-service/Dockerfile
    environment:
      <<: [*common-env, *service-urls]
      POSTGRES_HOST: employer-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${EMPLOYER_DB_NAME:-employers}
      POSTGRES_USER: ${EMPLOYER_DB_USER:-employers}
      POSTGRES_PASSWORD: ${EMPLOYER_DB_PASSWORD:-employers}
    depends_on:
      employer-db:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/employers/health', timeout=3)"]

  # --- Подбор и поиск кандидатов -------------------------------------------
  matching-db:
    <<: *postgres
    environment:
      POSTGRES_DB: ${MATCHING_DB_NAME:-matching}
      POSTGRES_USER: ${MATCHING_DB_USER:-matching}
      POSTGRES_PASSWORD: ${MATCHING_DB_PASSWORD:-matching}
    ports:
      - "127.0.0.1:${MATCHING_DB_PORT:-5440}:5432"
    volumes:
      - matching_db_data:/var/lib/postgresql/data

  matching-service:
    <<: *service-defaults
    image: ${IMAGE_PREFIX:-benefit}-matching-service:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: matching-service/Dockerfile
    environment:
      <<: [*common-env, *service-urls]
      POSTGRES_HOST: matching-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${MATCHING_DB_NAME:-matching}
      POSTGRES_USER: ${MATCHING_DB_USER:-matching}
      POSTGRES_PASSWORD: ${MATCHING_DB_PASSWORD:-matching}
    depends_on:
      matching-db:
        condition: service_healthy
      candidate-service:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/talent/health', timeout=3)"]

  # --- Переписка и регулярные задания ------------------------------------
  chat-db:
    <<: *postgres
    environment:
      POSTGRES_DB: ${CHAT_DB_NAME:-chat}
      POSTGRES_USER: ${CHAT_DB_USER:-chat}
      POSTGRES_PASSWORD: ${CHAT_DB_PASSWORD:-chat}
    ports:
      - "127.0.0.1:${CHAT_DB_PORT:-5438}:5432"
    volumes:
      - chat_db_data:/var/lib/postgresql/data

  chat-service:
    <<: *service-defaults
    image: ${IMAGE_PREFIX:-benefit}-chat-service:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: chat-service/Dockerfile
    environment:
      <<: [*common-env, *service-urls]
      POSTGRES_HOST: chat-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${CHAT_DB_NAME:-chat}
      POSTGRES_USER: ${CHAT_DB_USER:-chat}
      POSTGRES_PASSWORD: ${CHAT_DB_PASSWORD:-chat}
      FILES_DIR: /app/data/files
    volumes:
      - chat_files:/app/data/files
    depends_on:
      chat-db:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      candidate-service:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/chat/health', timeout=3)"]

  # --- Уведомления и почта ------------------------------------------------
  notification-db:
    <<: *postgres
    environment:
      POSTGRES_DB: ${NOTIFICATION_DB_NAME:-notifications}
      POSTGRES_USER: ${NOTIFICATION_DB_USER:-notifications}
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-notifications}
    ports:
      - "127.0.0.1:${NOTIFICATION_DB_PORT:-5436}:5432"
    volumes:
      - notification_db_data:/var/lib/postgresql/data

  notification-service:
    <<: *service-defaults
    image: ${IMAGE_PREFIX:-benefit}-notification-service:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: notification-service/Dockerfile
    environment:
      <<: [*common-env, *service-urls]
      POSTGRES_HOST: notification-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${NOTIFICATION_DB_NAME:-notifications}
      POSTGRES_USER: ${NOTIFICATION_DB_USER:-notifications}
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-notifications}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      notification-db:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/notifications/health', timeout=3)"]

  mail-service:
    <<: *service-defaults
    image: ${IMAGE_PREFIX:-benefit}-mail-service:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: mail-service/Dockerfile
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-change-me}
      MAIL_FROM: ${MAIL_FROM:-Benefit <no-reply@benefit.ru>}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
      SMTP_START_TLS: ${SMTP_START_TLS:-false}
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)"]

  # Тестовый SMTP-сервер: все письма видны в веб-интерфейсе.
  # Служебные интерфейсы (Mailpit, Grafana, Prometheus, Alertmanager) живут на
  # подпутях: так их проксирует фронтенд (http://<сервер>/mailpit/ и т.д.),
  # локально — те же пути на своих портах.
  mailpit:
    <<: *service-defaults
    image: axllent/mailpit:latest
    environment:
      MP_WEBROOT: /mailpit/
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"

  # --- Внешние провайдеры --------------------------------------------------
  fsp-id-mock:
    <<: *service-defaults
    image: ${IMAGE_PREFIX:-benefit}-fsp-id-mock:${IMAGE_TAG:-latest}
    build:
      context: ./backend/fsp-id-mock
    environment:
      PUBLIC_URL: http://localhost:${FSP_ID_PORT:-8003}
      CLIENT_ID: ${FSP_ID_CLIENT_ID:-benefit}
      CLIENT_SECRET: ${FSP_ID_CLIENT_SECRET:-fsp-dev-secret}
      REDIRECT_URIS: '["${AUTH_PUBLIC_URL:-http://localhost:8000}/api/v1/auth/oauth/fsp_id/callback"]'
    ports:
      - "127.0.0.1:${FSP_ID_PORT:-8003}:8000"

  keycloak:
    <<: *service-defaults
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Issuer в токенах — публичный адрес; auth-service ходит по внутреннему.
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8080}
      KC_HTTP_ENABLED: "true"
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./backend/keycloak:/opt/keycloak/data/import:ro

  # --- Мониторинг: Prometheus, Alertmanager, Grafana ----------------------
  # Метрики сервисов (GET /metrics во внутренней сети), шлюза и баз данных.
  prometheus:
    <<: *service-defaults
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.enable-lifecycle
      # Ссылки (в том числе в алертах) — на публичный адрес через фронтенд.
      - --web.external-url=${FRONTEND_URL:-http://localhost:3000}/prometheus/
      - --web.route-prefix=/prometheus/
    volumes:
      - ./backend/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./backend/monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/prometheus/-/ready"]
      <<: *healthcheck

  # Алерты уходят письмом (по умолчанию — в Mailpit, http://localhost:8025/mailpit/).
  alertmanager:
    <<: *service-defaults
    image: prom/alertmanager:v0.28.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.external-url=${FRONTEND_URL:-http://localhost:3000}/alertmanager/
      - --web.route-prefix=/alertmanager/
    configs:
      - source: alertmanager
        target: /etc/alertmanager/alertmanager.yml
    volumes:
      - alertmanager_data:/alertmanager
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"

  grafana:
    <<: *service-defaults
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-benefit-grafana}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/benefit-services.json
      GF_SERVER_ROOT_URL: ${FRONTEND_URL:-http://localhost:3000}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - ./backend/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./backend/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      # 3000 занят фронтендом.
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus
      - alertmanager

  # Экспортёр PostgreSQL: опрашивает все базы (auth-модули — в configs).
  postgres-exporter:
    <<: *service-defaults
    image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
    command: ["--config.file=/etc/postgres_exporter.yml"]
    configs:
      - source: postgres_exporter
        target: /etc/postgres_exporter.yml

  # Экспортёр шлюза: читает stub_status nginx (порт 8081 только в сети docker).
  nginx-exporter:
    <<: *service-defaults
    image: nginx/nginx-prometheus-exporter:1.4.2
    command: ["--nginx.scrape-uri=http://gateway:8081/stub_status"]
    depends_on:
      - gateway

  # --- Фронтенд: SPA + прокси API на шлюз (тот же origin) -----------------
  frontend:
    <<: *service-defaults
    image: ${IMAGE_PREFIX:-benefit}-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      args:
        VITE_LEGAL_OPERATOR_NAME: ${VITE_LEGAL_OPERATOR_NAME:-}
        VITE_LEGAL_OPERATOR_ADDRESS: ${VITE_LEGAL_OPERATOR_ADDRESS:-}
        VITE_LEGAL_CONTACT_EMAIL: ${VITE_LEGAL_CONTACT_EMAIL:-}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - gateway

configs:
  # Пароли баз подставляются из .env (те же, что у сервисов).
  postgres_exporter:
    content: |
      auth_modules:
        core: {type: userpass, userpass: {username: "${POSTGRES_USER:-benefit}", password: "${POSTGRES_PASSWORD:-benefit}"}, options: {sslmode: disable}}
        auth: {type: userpass, userpass: {username: "${AUTH_DB_USER:-auth}", password: "${AUTH_DB_PASSWORD:-auth}"}, options: {sslmode: disable}}
        candidate: {type: userpass, userpass: {username: "${CANDIDATE_DB_USER:-candidates}", password: "${CANDIDATE_DB_PASSWORD:-candidates}"}, options: {sslmode: disable}}
        assessment: {type: userpass, userpass: {username: "${ASSESSMENT_DB_USER:-assessments}", password: "${ASSESSMENT_DB_PASSWORD:-assessments}"}, options: {sslmode: disable}}
        applications: {type: userpass, userpass: {username: "${APPLICATIONS_DB_USER:-applications}", password: "${APPLICATIONS_DB_PASSWORD:-applications}"}, options: {sslmode: disable}}
        notification: {type: userpass, userpass: {username: "${NOTIFICATION_DB_USER:-notifications}", password: "${NOTIFICATION_DB_PASSWORD:-notifications}"}, options: {sslmode: disable}}
        chat: {type: userpass, userpass: {username: "${CHAT_DB_USER:-chat}", password: "${CHAT_DB_PASSWORD:-chat}"}, options: {sslmode: disable}}
        employer: {type: userpass, userpass: {username: "${EMPLOYER_DB_USER:-employers}", password: "${EMPLOYER_DB_PASSWORD:-employers}"}, options: {sslmode: disable}}
        matching: {type: userpass, userpass: {username: "${MATCHING_DB_USER:-matching}", password: "${MATCHING_DB_PASSWORD:-matching}"}, options: {sslmode: disable}}
  # Куда слать алерты: по умолчанию — письмом в Mailpit.
  alertmanager:
    content: |
      global:
        smtp_smarthost: "${ALERT_SMTP_HOST:-mailpit:1025}"
        smtp_from: "${ALERT_EMAIL_FROM:-alerts@benefit.local}"
        smtp_auth_username: "${ALERT_SMTP_USER:-}"
        smtp_auth_password: "${ALERT_SMTP_PASSWORD:-}"
        smtp_require_tls: ${ALERT_SMTP_REQUIRE_TLS:-false}
      route:
        receiver: email
        group_by: [alertname, job]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h
        routes:
          - matchers: ['severity="critical"']
            receiver: email
            repeat_interval: 1h
      receivers:
        - name: email
          email_configs:
            - to: "${ALERT_EMAIL_TO:-ops@benefit.local}"
              send_resolved: true
      inhibit_rules:
        # Сервис лежит — не дублируем алертами о его ошибках и задержках.
        - source_matchers: ['alertname="ServiceDown"']
          target_matchers: ['severity="warning"']
          equal: [job]
        - source_matchers: ['alertname="GatewayDown"']
          target_matchers: ['alertname=~"HighErrorRate|HighLatency"']

volumes:
  postgres_data:
  auth_db_data:
  auth_keys:
  candidate_db_data:
  assessment_db_data:
  applications_db_data:
  notification_db_data:
  chat_db_data:
  chat_files:
  employer_db_data:
  matching_db_data:
  prometheus_data:
  alertmanager_data:
  grafana_data:
