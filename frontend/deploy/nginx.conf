# Фронтенд Benefit: статика SPA + прокси API на шлюз (gateway).
# Лимиты, CORS и маршрутизация по сервисам — на шлюзе; здесь только
# передаётся реальный адрес клиента (X-Forwarded-For).

# Встроенный DNS Docker: адрес шлюза перечитывается после его перезапуска.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    # Вложения в чате — до 20 МБ (точный лимит проверяет шлюз).
    client_max_body_size 25m;

    set $gateway http://gateway:80;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # API, OAuth/JWKS и документация (Swagger) — на шлюз как есть.
    # /internal и /metrics тоже: шлюз сам отвечает на них 404.
    location ~ ^/(api/|\.well-known/|docs|redoc|openapi\.json|internal/|metrics$) {
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket чата.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Сборка Vite: имена файлов с хешем — кэшируются навсегда.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Клиентская маршрутизация: неизвестные пути отдают index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
