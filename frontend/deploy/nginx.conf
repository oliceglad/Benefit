# Фронтенд Benefit: статика SPA + прокси API на шлюз (gateway).
# Лимиты, CORS и маршрутизация по сервисам — на шлюзе; здесь только
# передаётся реальный адрес клиента (X-Forwarded-For).

# Встроенный DNS Docker: адрес шлюза перечитывается после его перезапуска.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# Есть ли у браузера сессия (cookie ставит auth-service). Refresh-cookie
# привязана к /api/v1/auth и сюда не приходит, поэтому смотрим access и CSRF.
map "$cookie_benefit_access$cookie_benefit_csrf" $has_session {
    ""      0;
    default 1;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    # Редиректы относительные: внешний порт (3000 локально, 80 на сервере)
    # nginx внутри контейнера не знает.
    absolute_redirect off;
    # Вложения в чате — до 20 МБ (точный лимит проверяет шлюз).
    client_max_body_size 25m;

    set $gateway http://gateway:80;
    set $mailpit http://mailpit:8025;
    set $grafana http://grafana:3000;
    set $prometheus http://prometheus:9090;
    set $alertmanager http://alertmanager:9093;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # API, OAuth/JWKS и документация (Swagger) — на шлюз как есть.
    # /internal и /metrics тоже: шлюз сам отвечает на них 404.
    location ~ ^/(api/|\.well-known/|docs|redoc|openapi\.json|internal/|metrics$) {
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket чата.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- Служебные интерфейсы для тестового стенда --------------------------
    # Открыты без отдельной авторизации (у Grafana — свой вход). Каждый
    # сервис настроен на свой подпуть (docker-compose.yml), путь не меняется.
    location /mailpit/ {
        proxy_pass $mailpit;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Живое обновление списка писем — по WebSocket.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    location /grafana/ {
        proxy_pass $grafana;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location /prometheus/ {
        proxy_pass $prometheus;
        proxy_set_header Host $host;
    }

    location /alertmanager/ {
        proxy_pass $alertmanager;
        proxy_set_header Host $host;
    }

    location = /mailpit { return 301 /mailpit/; }
    location = /grafana { return 301 /grafana/; }
    location = /prometheus { return 301 /prometheus/; }
    location = /alertmanager { return 301 /alertmanager/; }

    # Главная: без сессии — сразу на вход, не дожидаясь загрузки SPA. С
    # сессией SPA сама уведёт в /profile (а /login — тоже, если вход уже есть).
    location = / {
        if ($has_session = 0) {
            return 302 /login;
        }
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # Сборка Vite: имена файлов с хешем — кэшируются навсегда.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Клиентская маршрутизация: неизвестные пути отдают index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
