      - source_path: src/components/ui/table.tsx
        local_path: src/shared/ui/table.tsx
        changes: Adapted aliases, Benefit tokens and responsive row layout for resume import review without horizontal mobile scrolling.
      - source_path: src/components/ui/dropdown-menu.tsx
        local_path: src/shared/ui/dropdown-menu.tsx
        changes: Adapted aliases, Benefit focus styles and touch targets for the accessible candidate account menu.
      - source_path: src/hooks/use-mobile.tsx
        local_path: src/shared/lib/use-desktop-layout.ts
        changes: Adapted useSyncExternalStore media-query pattern to the existing lg desktop breakpoint without duplicating mounted forms.
      - source_path: src/components/data-table/faceted-filter.tsx
        local_path: src/features/candidate-profile/ui/searchable-multi-select.tsx
        changes: Composition reference for searchable multi-selection; adapted to native listbox semantics, Benefit chips, selection limits and profile form state without table dependencies.
