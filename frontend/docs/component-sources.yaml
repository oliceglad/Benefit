      - source_path: src/components/ui/select.tsx
        local_path: src/shared/ui/select.tsx
        changes: Adapted aliases, responsive control sizing, Benefit focus styles and popover width; wrapped by the local SelectField adapter.
      - source_path: src/components/ui/checkbox.tsx
        local_path: src/shared/ui/checkbox.tsx
        changes: Adapted aliases, sizing and Benefit focus/checked states.
